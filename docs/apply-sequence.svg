<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 802" width="1280" height="802" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title>Sequence: what happens when a developer applies an App</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
    <style>
      .t  { fill:#0F172A; }
      .s  { fill:#475569; font-size:11px; }
      .h  { font-weight:600; font-size:13px; fill:#0F172A; }
      .msg{ font-size:11.5px; fill:#0F172A; stroke:#FFFFFF; stroke-width:4px; paint-order:stroke; stroke-linejoin:round; }
      .rep{ font-size:11.5px; fill:#475569; stroke:#FFFFFF; stroke-width:4px; paint-order:stroke; stroke-linejoin:round; }
      .num{ font-size:10px; font-weight:700; fill:#FFFFFF; }
      .band{ font-size:10.5px; font-weight:600; fill:#64748B; letter-spacing:.04em; }
      .xp { fill:#EDE9FE; stroke:#6D28D9; }
      .fn { fill:#CCFBF1; stroke:#0F766E; }
      .pv { fill:#DBEAFE; stroke:#1D4ED8; }
      .k8 { fill:#DCFCE7; stroke:#15803D; }
      .pg { fill:#FFEDD5; stroke:#C2410C; }
      .mac{ fill:#F8FAFC; stroke:#64748B; }
      .box{ stroke-width:1.4; }
      .life{ stroke:#CBD5E1; stroke-width:1.4; stroke-dasharray:4 4; }
      .ln { stroke:#334155; stroke-width:1.4; fill:none; }
      .lr { stroke:#64748B; stroke-width:1.4; fill:none; stroke-dasharray:6 4; }
    </style>
  </defs>
  <rect width="1280" height="802" fill="#FFFFFF"/>
  <text x="20" y="34" font-size="18" font-weight="700" class="t">What happens when a developer applies an App</text>
  <text x="470" y="34" class="s">App/hello with database.enabled: true · Crossplane v2 · each step waits for the previous one to be observed</text>
  <rect x="10" y="118" width="1260" height="116" fill="#F8FAFC"/>
  <text x="1262" y="134" text-anchor="end" class="band">1 · REQUEST</text>
  <rect x="10" y="232" width="1260" height="154" fill="#FFFFFF"/>
  <text x="1262" y="248" text-anchor="end" class="band">2 · FIRST RENDER</text>
  <rect x="10" y="384" width="1260" height="78" fill="#F8FAFC"/>
  <text x="1262" y="400" text-anchor="end" class="band">3 · DATABASE STARTS</text>
  <rect x="10" y="460" width="1260" height="116" fill="#FFFFFF"/>
  <text x="1262" y="476" text-anchor="end" class="band">4 · OBSERVE DATABASE</text>
  <rect x="10" y="574" width="1260" height="142" fill="#F8FAFC"/>
  <text x="1262" y="590" text-anchor="end" class="band">5 · CONNECT + READY</text>
  <line x1="90" y1="110" x2="90" y2="732" class="life"/>
  <rect x="15.0" y="60" width="150" height="50" rx="7" class="mac box"/>
  <rect x="15.0" y="732" width="150" height="28" rx="7" class="mac box"/>
  <text x="90" y="81" text-anchor="middle" class="h">Developer</text>
  <text x="90" y="98" text-anchor="middle" class="s">Mac · kubectl</text>
  <text x="90" y="750" text-anchor="middle" class="h" font-size="12">Developer</text>
  <line x1="265" y1="110" x2="265" y2="732" class="life"/>
  <rect x="190.0" y="60" width="150" height="50" rx="7" class="k8 box"/>
  <rect x="190.0" y="732" width="150" height="28" rx="7" class="k8 box"/>
  <text x="265" y="81" text-anchor="middle" class="h">kube-apiserver</text>
  <text x="265" y="98" text-anchor="middle" class="s">Docker Desktop Kubernetes</text>
  <text x="265" y="750" text-anchor="middle" class="h" font-size="12">kube-apiserver</text>
  <line x1="435" y1="110" x2="435" y2="732" class="life"/>
  <rect x="360.0" y="60" width="150" height="50" rx="7" class="xp box"/>
  <rect x="360.0" y="732" width="150" height="28" rx="7" class="xp box"/>
  <text x="435" y="81" text-anchor="middle" class="h">Crossplane</text>
  <text x="435" y="98" text-anchor="middle" class="s">core controller</text>
  <text x="435" y="750" text-anchor="middle" class="h" font-size="12">Crossplane</text>
  <line x1="615" y1="110" x2="615" y2="732" class="life"/>
  <rect x="540.0" y="60" width="150" height="50" rx="7" class="fn box"/>
  <rect x="540.0" y="732" width="150" height="28" rx="7" class="fn box"/>
  <text x="615" y="81" text-anchor="middle" class="h">Functions</text>
  <text x="615" y="98" text-anchor="middle" class="s">3 composition functions</text>
  <text x="615" y="750" text-anchor="middle" class="h" font-size="12">Functions</text>
  <line x1="795" y1="110" x2="795" y2="732" class="life"/>
  <rect x="720.0" y="60" width="150" height="50" rx="7" class="pv box"/>
  <rect x="720.0" y="732" width="150" height="28" rx="7" class="pv box"/>
  <text x="795" y="81" text-anchor="middle" class="h">provider-helm</text>
  <text x="795" y="98" text-anchor="middle" class="s">Release MRs</text>
  <text x="795" y="750" text-anchor="middle" class="h" font-size="12">provider-helm</text>
  <line x1="960" y1="110" x2="960" y2="732" class="life"/>
  <rect x="885.0" y="60" width="150" height="50" rx="7" class="pg box"/>
  <rect x="885.0" y="732" width="150" height="28" rx="7" class="pg box"/>
  <text x="960" y="81" text-anchor="middle" class="h">CNPG operator</text>
  <text x="960" y="98" text-anchor="middle" class="s">runs PostgreSQL</text>
  <text x="960" y="750" text-anchor="middle" class="h" font-size="12">CNPG operator</text>
  <line x1="1120" y1="110" x2="1120" y2="732" class="life"/>
  <rect x="1045.0" y="60" width="150" height="50" rx="7" class="pv box"/>
  <rect x="1045.0" y="732" width="150" height="28" rx="7" class="pv box"/>
  <text x="1120" y="81" text-anchor="middle" class="h">provider-kubernetes</text>
  <text x="1120" y="98" text-anchor="middle" class="s">Object MRs (observe-only)</text>
  <text x="1120" y="750" text-anchor="middle" class="h" font-size="12">provider-kubernetes</text>
  <line x1="94" y1="144" x2="262" y2="144" class="ln" marker-end="url(#a)"/>
  <circle cx="106" cy="144" r="8.5" fill="#334155"/>
  <text x="106" y="147.5" text-anchor="middle" class="num">1</text>
  <text x="120" y="137" text-anchor="start" class="msg">kubectl apply App/hello</text>
  <line x1="261" y1="182" x2="93" y2="182" class="lr" marker-end="url(#ar)"/>
  <circle cx="249" cy="182" r="8.5" fill="#64748B"/>
  <text x="249" y="185.5" text-anchor="middle" class="num">2</text>
  <text x="235" y="161" text-anchor="end" class="rep">rejected if the schema</text>
  <text x="235" y="175" text-anchor="end" class="rep">is invalid (e.g. size: huge)</text>
  <line x1="269" y1="220" x2="432" y2="220" class="ln" marker-end="url(#a)"/>
  <circle cx="281" cy="220" r="8.5" fill="#334155"/>
  <text x="281" y="223.5" text-anchor="middle" class="num">3</text>
  <text x="295" y="213" text-anchor="start" class="msg">App created (watch event)</text>
  <line x1="439" y1="258" x2="612" y2="258" class="ln" marker-end="url(#a)"/>
  <circle cx="451" cy="258" r="8.5" fill="#334155"/>
  <text x="451" y="261.5" text-anchor="middle" class="num">4</text>
  <text x="465" y="251" text-anchor="start" class="msg">run pipeline: observed state → desired state</text>
  <line x1="611" y1="296" x2="438" y2="296" class="lr" marker-end="url(#ar)"/>
  <circle cx="599" cy="296" r="8.5" fill="#64748B"/>
  <text x="599" y="299.5" text-anchor="middle" class="num">5</text>
  <text x="585" y="289" text-anchor="end" class="rep">Deployment, Service, Release (+ status)</text>
  <line x1="431" y1="334" x2="268" y2="334" class="ln" marker-end="url(#a)"/>
  <circle cx="419" cy="334" r="8.5" fill="#334155"/>
  <text x="419" y="337.5" text-anchor="middle" class="num">6</text>
  <text x="405" y="327" text-anchor="end" class="msg">apply Deployment + Service directly</text>
  <line x1="431" y1="372" x2="268" y2="372" class="ln" marker-end="url(#a)"/>
  <circle cx="419" cy="372" r="8.5" fill="#334155"/>
  <text x="419" y="375.5" text-anchor="middle" class="num">7</text>
  <text x="405" y="365" text-anchor="end" class="msg">apply Release (helm.m.crossplane.io)</text>
  <line x1="791" y1="410" x2="268" y2="410" class="ln" marker-end="url(#a)"/>
  <circle cx="779" cy="410" r="8.5" fill="#334155"/>
  <text x="779" y="413.5" text-anchor="middle" class="num">8</text>
  <text x="765" y="403" text-anchor="end" class="msg">helm install cnpg/cluster → Cluster CR</text>
  <line x1="956" y1="448" x2="268" y2="448" class="ln" marker-end="url(#a)"/>
  <circle cx="944" cy="448" r="8.5" fill="#334155"/>
  <text x="944" y="451.5" text-anchor="middle" class="num">9</text>
  <text x="930" y="441" text-anchor="end" class="msg">Postgres pod, Services, Secret hello-db-app</text>
  <line x1="439" y1="486" x2="612" y2="486" class="ln" marker-end="url(#a)"/>
  <circle cx="451" cy="486" r="8.5" fill="#334155"/>
  <text x="451" y="489.5" text-anchor="middle" class="num">10</text>
  <text x="465" y="479" text-anchor="start" class="msg">re-run pipeline (Release now observed)</text>
  <line x1="611" y1="524" x2="438" y2="524" class="lr" marker-end="url(#ar)"/>
  <circle cx="599" cy="524" r="8.5" fill="#64748B"/>
  <text x="599" y="527.5" text-anchor="middle" class="num">11</text>
  <text x="585" y="517" text-anchor="end" class="rep">+ observe-only Objects for Cluster &amp; Secret</text>
  <line x1="1116" y1="562" x2="268" y2="562" class="ln" marker-end="url(#a)"/>
  <circle cx="1104" cy="562" r="8.5" fill="#334155"/>
  <text x="1104" y="565.5" text-anchor="middle" class="num">12</text>
  <text x="1090" y="555" text-anchor="end" class="msg">read Cluster status / Secret data</text>
  <line x1="439" y1="600" x2="612" y2="600" class="ln" marker-end="url(#a)"/>
  <circle cx="451" cy="600" r="8.5" fill="#334155"/>
  <text x="451" y="603.5" text-anchor="middle" class="num">13</text>
  <text x="465" y="593" text-anchor="start" class="msg">re-run (credentials observed, Cluster Ready)</text>
  <line x1="611" y1="638" x2="438" y2="638" class="lr" marker-end="url(#ar)"/>
  <circle cx="599" cy="638" r="8.5" fill="#64748B"/>
  <text x="599" y="641.5" text-anchor="middle" class="num">14</text>
  <text x="585" y="631" text-anchor="end" class="rep">+ Secret hello-db-conn, status.dbReady=true</text>
  <rect x="365" y="664" width="320" height="44" rx="6" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.2"/>
  <text x="525.0" y="682" text-anchor="middle" class="t">function-auto-ready marks the App <tspan font-weight="600">Ready</tspan></text>
  <text x="525.0" y="698" text-anchor="middle" class="t">only when every composed resource is Ready</text>
  <g transform="translate(20,776)">
    <line x1="0" y1="0" x2="34" y2="0" class="ln" marker-end="url(#a)"/><text x="42" y="4" class="s">request / action</text>
    <line x1="160" y1="0" x2="194" y2="0" class="lr" marker-end="url(#ar)"/><text x="202" y="4" class="s">response / result</text>
    <text x="340" y="4" class="s">Crossplane re-runs the pipeline whenever something it composed changes (watches), so steps 4, 10 and 13 are the same loop.</text>
  </g>
</svg>
