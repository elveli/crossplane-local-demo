# DeploymentRuntimeConfig = how Crossplane runs each provider's pod.
# (Replaces the removed v1 ControllerConfig.)
#
# Why one per provider: each provider gets a *named, stable* ServiceAccount so
# 03-rbac.yaml can bind exactly the extra permissions that provider needs, and
# nothing more. Without a name, Crossplane generates one per package revision
# (e.g. provider-helm-1a2b3c4d5e6f), which changes on every upgrade.
#
# Resources: small requests for laptops; limits leave headroom for Helm chart
# rendering (provider-helm) and informer caches (provider-kubernetes).
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-kubernetes
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-kubernetes
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              args:
                # In this demo provider-kubernetes only runs Observe-only Objects.
                # With SSA enabled it still computes "desired state" via a
                # dry-run server-side apply = a PATCH request, which RBAC can't
                # tell apart from a real write. Client-side mode lets Observe
                # get by with get/list/watch only (see 03-rbac.yaml).
                - --no-enable-server-side-apply   # kingpin bool: --no-<flag>, not =false
                # Smaller status.atProvider.manifest (drop managedFields noise).
                - --remove-managed-fields
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: provider-helm
spec:
  serviceAccountTemplate:
    metadata:
      name: provider-helm
  deploymentTemplate:
    spec:
      selector: {}
      template:
        spec:
          containers:
            - name: package-runtime
              resources:
                requests: { cpu: 25m, memory: 64Mi }
                limits: { cpu: 500m, memory: 512Mi }
