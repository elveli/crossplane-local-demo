# Helm values for crossplane-stable/crossplane (version pinned in versions.env).
# Laptop-friendly: chart defaults are already 1 replica each; we only trim the
# *requests* so the scheduler doesn't reserve RAM we rarely use. Limits stay at
# chart defaults — Crossplane's memory grows with the number of CRDs it watches
# (the optional AWS providers in Phase 6 add many), and a tight limit = OOMKilled.
resourcesCrossplane:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 1024Mi

resourcesRBACManager:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 512Mi

# Crossplane v2 guards each XR with a watch circuit breaker: more than `burst`
# watch events (refilling at `refill-rate`/s) from its composed resources opens
# it, and while open the XR is reconciled only every ~30s for `cooldown`.
# The demo's drift scene (scale 5 -> 2, delete + recreate) can trip it, which
# then delays the next scene by up to 5 minutes with the default cooldown.
# 1m keeps the demo flowing; keep the 5m default in production.
args:
  - --circuit-breaker-cooldown=1m
