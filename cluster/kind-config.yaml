# Single-node kind cluster used when CLUSTER=kind.
# hostPort 30080 maps the App's NodePort straight to the Mac (http://localhost:30080).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
