# Same API, different implementation: select the prod Composition by label.
apiVersion: platform.demo.io/v1alpha1
kind: App
metadata:
  name: hello-prod
  namespace: team-a
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        platform.demo.io/env: prod
  image: nginxdemos/hello:plain-text
  replicas: 2
  port: 80            # what the container listens on
  servicePort: 8090   # each exposed App needs its own localhost port
  database:
    enabled: true
    size: small
  expose: true
