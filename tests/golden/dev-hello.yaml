---
apiVersion: platform.demo.io/v1alpha1
kind: App
metadata:
  name: hello
  namespace: team-a
spec:
  crossplane:
    resourceRefs:
    - apiVersion: apps/v1
      kind: Deployment
      name: hello
    - apiVersion: helm.m.crossplane.io/v1beta1
      kind: Release
      name: hello-db
    - apiVersion: v1
      kind: Service
      name: hello
  database:
    enabled: true
    size: small
  expose: true
  image: nginxdemos/hello:plain-text
  port: 80
  replicas: 2
status:
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: WatchCircuitClosed
    status: "True"
    type: Responsive
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: ReconcileSuccess
    status: "True"
    type: Synced
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: db-release, deployment, and service'
    reason: Creating
    status: "False"
    type: Ready
  connectionSecret: ""
  dbReady: false
  url: http://localhost:80
---
apiVersion: helm.m.crossplane.io/v1beta1
kind: Release
metadata:
  annotations:
    crossplane.io/composition-resource-name: db-release
  labels:
    crossplane.io/composite: hello
  name: hello-db
  namespace: team-a
  ownerReferences:
  - apiVersion: platform.demo.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: hello
    uid: e1db648d-795d-5492-b013-605891baec6a
spec:
  forProvider:
    chart:
      name: cluster
      repository: https://cloudnative-pg.github.io/charts
      version: 0.9.0
    namespace: team-a
    skipCreateNamespace: true
    values:
      cluster:
        enablePDB: false
        enableSuperuserAccess: false
        imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie
        initdb:
          database: app
          owner: app
        instances: 1
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        storage:
          size: 1Gi
      fullnameOverride: hello-db
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    crossplane.io/composition-resource-name: deployment
  labels:
    crossplane.io/composite: hello
  name: hello
  namespace: team-a
  ownerReferences:
  - apiVersion: platform.demo.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: hello
    uid: e1db648d-795d-5492-b013-605891baec6a
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
    spec:
      containers:
      - image: nginxdemos/hello:plain-text
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          periodSeconds: 5
          tcpSocket:
            port: http
        resources:
          limits:
            cpu: 200m
            memory: 64Mi
          requests:
            cpu: 10m
            memory: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    crossplane.io/composition-resource-name: service
  labels:
    crossplane.io/composite: hello
  name: hello
  namespace: team-a
  ownerReferences:
  - apiVersion: platform.demo.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: hello
    uid: e1db648d-795d-5492-b013-605891baec6a
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: hello
  type: LoadBalancer
