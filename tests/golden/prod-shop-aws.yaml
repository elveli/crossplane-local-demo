---
apiVersion: platform.demo.io/v1alpha1
kind: App
metadata:
  name: shop
  namespace: team-a
spec:
  bucket: true
  crossplane:
    resourceRefs:
    - apiVersion: apps/v1
      kind: Deployment
      name: shop
    - apiVersion: dynamodb.aws.m.upbound.io/v1beta1
      kind: Table
      name: shop-table
    - apiVersion: policy/v1
      kind: PodDisruptionBudget
      name: shop
    - apiVersion: s3.aws.m.upbound.io/v1beta1
      kind: BucketVersioning
      name: shop-bucket-versioning
    - apiVersion: s3.aws.m.upbound.io/v1beta1
      kind: Bucket
      name: shop-bucket
    - apiVersion: v1
      kind: ConfigMap
      name: shop-aws
    - apiVersion: v1
      kind: Service
      name: shop
  database:
    enabled: false
    size: small
  expose: false
  image: nginxdemos/hello:plain-text
  port: 80
  replicas: 1
  table: true
status:
  awsConfig: shop-aws
  bucket: team-a-shop
  conditions:
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: WatchCircuitClosed
    status: "True"
    type: Responsive
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    reason: ReconcileSuccess
    status: "True"
    type: Synced
  - lastTransitionTime: "2024-01-01T00:00:00Z"
    message: 'Unready resources: aws-config, bucket, bucket-versioning, and 4 more'
    reason: Creating
    status: "False"
    type: Ready
  connectionSecret: ""
  dbReady: false
  table: team-a-shop
  url: http://shop.team-a.svc.cluster.local:80
---
apiVersion: v1
data:
  AWS_DEFAULT_REGION: us-west-2
  AWS_ENDPOINT_URL: http://localstack.localstack.svc.cluster.local:4566
  AWS_REGION: us-west-2
  DYNAMODB_TABLE: team-a-shop
  S3_BUCKET: team-a-shop
kind: ConfigMap
metadata:
  annotations:
    crossplane.io/composition-resource-name: aws-config
  labels:
    crossplane.io/composite: shop
    platform.demo.io/app: shop
  name: shop-aws
  namespace: team-a
  ownerReferences:
  - apiVersion: platform.demo.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: shop
    uid: 8e03f8bc-d4ec-54f8-b6fe-15105afd073a
---
apiVersion: s3.aws.m.upbound.io/v1beta1
kind: Bucket
metadata:
  annotations:
    crossplane.io/composition-resource-name: bucket
    crossplane.io/external-name: team-a-shop
  labels:
    crossplane.io/composite: shop
  name: shop-bucket
  namespace: team-a
  ownerReferences:
  - apiVersion: platform.demo.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: shop
    uid: 8e03f8bc-d4ec-54f8-b6fe-15105afd073a
spec:
  forProvider:
    forceDestroy: true
    region: us-west-2
    tags:
      App: shop
      Project: crossplane-local-demo
  providerConfigRef:
    kind: ClusterProviderConfig
    name: localstack
---
apiVersion: s3.aws.m.upbound.io/v1beta1
kind: BucketVersioning
metadata:
  annotations:
    crossplane.io/composition-resource-name: bucket-versioning
  labels:
    crossplane.io/composite: shop
  name: shop-bucket-versioning
  namespace: team-a
  ownerReferences:
  - apiVersion: platform.demo.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: shop
    uid: 8e03f8bc-d4ec-54f8-b6fe-15105afd073a
spec:
  forProvider:
    bucketRef:
      name: shop-bucket
    region: us-west-2
    versioningConfiguration:
      status: Enabled
  providerConfigRef:
    kind: ClusterProviderConfig
    name: localstack
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    crossplane.io/composition-resource-name: deployment
  labels:
    crossplane.io/composite: shop
  name: shop
  namespace: team-a
  ownerReferences:
  - apiVersion: platform.demo.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: shop
    uid: 8e03f8bc-d4ec-54f8-b6fe-15105afd073a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shop
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop
    spec:
      containers:
      - image: nginxdemos/hello:plain-text
        livenessProbe:
          periodSeconds: 10
          tcpSocket:
            port: http
        name: app
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          periodSeconds: 5
          tcpSocket:
            port: http
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 32Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  annotations:
    crossplane.io/composition-resource-name: pdb
  labels:
    crossplane.io/composite: shop
  name: shop
  namespace: team-a
  ownerReferences:
  - apiVersion: platform.demo.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: shop
    uid: 8e03f8bc-d4ec-54f8-b6fe-15105afd073a
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shop
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    crossplane.io/composition-resource-name: service
  labels:
    crossplane.io/composite: shop
  name: shop
  namespace: team-a
  ownerReferences:
  - apiVersion: platform.demo.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: shop
    uid: 8e03f8bc-d4ec-54f8-b6fe-15105afd073a
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: shop
  type: ClusterIP
---
apiVersion: dynamodb.aws.m.upbound.io/v1beta1
kind: Table
metadata:
  annotations:
    crossplane.io/composition-resource-name: table
    crossplane.io/external-name: team-a-shop
  labels:
    crossplane.io/composite: shop
  name: shop-table
  namespace: team-a
  ownerReferences:
  - apiVersion: platform.demo.io/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: App
    name: shop
    uid: 8e03f8bc-d4ec-54f8-b6fe-15105afd073a
spec:
  forProvider:
    attribute:
    - name: id
      type: S
    billingMode: PAY_PER_REQUEST
    hashKey: id
    pointInTimeRecovery:
      enabled: true
    region: us-west-2
    tags:
      App: shop
      Project: crossplane-local-demo
  providerConfigRef:
    kind: ClusterProviderConfig
    name: localstack
